name: Create a comment on new issues

permissions:
  issues: write
  
on:
  issues:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
     - name: Create comment
       uses: peter-evans/create-or-update-comment@v5
       with:
        issue-number: ${{ github.event.issue.number }}
        body: |
          **Welcome** You made an issue! Thank you for your contribution. We will review it as soon as possible.
        reactions: '+1'